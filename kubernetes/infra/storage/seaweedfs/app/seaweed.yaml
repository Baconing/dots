apiVersion: seaweed.seaweedfs.com/v1
kind: Seaweed
metadata:
  name: seaweedfs
  namespace: seaweedfs
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  image: chrislusf/seaweedfs:4.46
  admin:
    enabled: true
    ingress:
      enabled: true
      className: traefik
      host: seaweed.saturn.ci
      annotations:
        traefik.ingress.kubernetes.io/router.tls: "true"
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: SeaweedFS
        gethomepage.dev/group: Infrastructure
        gethomepage.dev/icon: seaweedfs
        traefik.ingress.kubernetes.io/router.middlewares: 'traefik-forwardauth-authelia@kubernetescrd'
        external-dns.alpha.kubernetes.io/enabled: "true"
        external-dns.alpha.kubernetes.io/hostname: admin.seaweed.saturn.ci
        external-dns.alpha.kubernetes.io/target: direct.saturn.ci
      tls:
        - hosts:
            - seaweed.saturn.ci
          secretName: seaweed.saturn.ci
  master:
    replicas: 3
  volume:
    replicas: 1
    requests:
      storage: 10Gi
  filer:
    replicas: 2
    s3:
      enabled: true
    s3Ingress:
      enabled: true
      className: traefik
      host: s3.seaweed.saturn.ci
      annotations:
        traefik.ingress.kubernetes.io/router.tls: "true"
        gethomepage.dev/enabled: "false"
        traefik.ingress.kubernetes.io/router.middlewares: 'traefik-forwardauth-authelia@kubernetescrd'
        external-dns.alpha.kubernetes.io/enabled: "true"
        external-dns.alpha.kubernetes.io/hostname: s3.seaweed.saturn.ci
        external-dns.alpha.kubernetes.io/target: direct.saturn.ci
    ingress:
      enabled: true
      className: traefik
      host: filer.seaweed.saturn.ci
      annotations:
        traefik.ingress.kubernetes.io/router.tls: "true"
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: SeaweedFS Filer
        gethomepage.dev/group: Infrastructure
        gethomepage.dev/icon: seaweedfs
        traefik.ingress.kubernetes.io/router.middlewares: 'traefik-forwardauth-authelia@kubernetescrd'
        external-dns.alpha.kubernetes.io/enabled: "true"
        external-dns.alpha.kubernetes.io/hostname: filer.seaweed.saturn.ci
        external-dns.alpha.kubernetes.io/target: direct.saturn.ci
      tls:
        - hosts:
            - filer.seaweed.saturn.ci
          secretName: filer.seaweed.saturn.ci
    config: |
      [leveldb2]
      enabled = true
      dir = "/data/filerldb2"