apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-iscsi
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
parameters:
  backupTargetName: "default"
  dataEngine: "v1" # TODO: ISCSI is not a frontend type in v2, but NVME-oF is.
  dataLocality: "disabled"
  numberOfReplicas: "3"
  staleReplicaTimeout: "5"
  migratable: "true"
  fsType: "ext4" # When using longhorn-iscsi, you should set volumeMode: Block in the PVC.
  fromBackup: ""
  frontend: "iscsi" 