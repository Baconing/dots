apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-helm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    chart: cert-manager
    repoURL: https://charts.jetstack.io
    targetRevision: v1.21.1
    helm:
      releaseName: cert-manager
      valuesObject:
        image:
          repository: quay.io/jetstack/cert-manager-controller
          tag: v1.21.1

        crds:
          enabled: true

        podDisruptionBudget:
          enabled: true
          minAvailable: 1

        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 100m
            memory: 256Mi

        prometheus:
          enabled: true
          servicemonitor:
            enabled: true

        webhook:
          image:
            repository: quay.io/jetstack/cert-manager-webhook
            tag: v1.21.1

          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi

          podDisruptionBudget:
            enabled: true
            minAvailable: 1

        cainjector:
          image:
            repository: quay.io/jetstack/cert-manager-cainjector
            tag: v1.21.1

          resources:
            requests:
              cpu: 5m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 256Mi

          podDisruptionBudget:
            enabled: true
            minAvailable: 1

  destination:
    name: in-cluster
    namespace: cert-manager

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - FailOnSharedResource=true
    automated:
      prune: true
      selfHeal: true

  