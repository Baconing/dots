apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-helm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    chart: traefik
    repoURL: https://traefik.github.io/charts
    targetRevision: 42.4.0
    helm:
      releaseName: traefik
      valuesObject:
        service:
          spec:
            loadBalancerIP: 10.10.254.1
            externalTrafficPolicy: Local

        api:
          dashboard: true

        ports:
          web:
            http:
              maxHeaderBytes: 4194304
          websecure:
            http:
              maxHeaderBytes: 4194304
              middlewares:
                - traefik-authelia-web@kubernetescrd
            transport:
              respondingTimeouts:
                readTimeout: 3600s # For large file uploads to S3 and others.
                idleTimeout: 3600s
            forwardedHeaders:
              insecure: false
              trustedIPs:
                - "10.42.0.0/16" # Pod CIDR in Flannel.
                - "10.10.254.1/32" # LoadBalancer IP for Traefik.
                - "10.10.0.0/16" # Node subnet on network.

        providers:
          kubernetesIngress:
            allowExternalNameServices: true
          kubernetesCRD:
            allowExternalNameServices: true

        ingressRoute:
          dashboard:
            enabled: true
            annotations: 
              kubernetes.io/ingress.class: traefik
              gethomepage.dev/enabled: "true"
              gethomepage.dev/href: "https://traefik.saturn.ci" # Need this when using Traefik IngressRoutes
              gethomepage.dev/name: Traefik
              gethomepage.dev/group: Network
              gethomepage.dev/icon: traefik-proxy
              traefik.ingress.kubernetes.io/router.tls: "true"
              external-dns.kubernetes.io/enabled: "true"
              external-dns.kubernetes.io/hostname: traefik.saturn.ci
              external-dns.kubernetes.io/target: direct.saturn.ci
            matchRule: Host(`traefik.saturn.ci`)
            services:
              - name: api@internal
                kind: TraefikService
            entryPoints: 
              - "websecure"
            middlewares:
              - name: authelia-web
                namespace: traefik
            tls:
              secretName: traefik.saturn.ci

  destination:
    name: in-cluster
    namespace: traefik

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - FailOnSharedResource=true
    automated:
      prune: true
      selfHeal: true

  
