apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp-helm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    chart: headlamp
    repoURL: https://kubernetes-sigs.github.io/headlamp/
    targetRevision: 0.44.0
    helm:
      releaseName: headlamp
      valuesObject:
        image:
          registry: ghcr.io
          repository: headlamp-k8s/headlamp
          tag: v0.45.0

        config:
          inCluster: true

          unsafeUseServiceAccountToken: true

          watchPlugins: true

        pluginsManager:
          enabled: true
          configContent: |
            plugins:
              - name: argocd
                source: https://artifacthub.io/packages/headlamp/headlamp-argocd/headlamp-argocd
                version: 0.1.3
              - name: cert-manager
                source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_cert-manager
                version: 0.1.1
              - name: intel-gpu
                source: https://artifacthub.io/packages/headlamp/headlamp-intel-gpu/headlamp-intel-gpu
                version: 1.1.0
              - name: kompose
                source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_kompose
                version: 0.1.1-beta
              - name: kyverno
                source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_kyverno
                version: 0.1.0

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

        ingress:
          enabled: true
          ingressClassName: traefik
          annotations:
            traefik.ingress.kubernetes.io/router.tls: "true"
            gethomepage.dev/enabled: "true"
            gethomepage.dev/name: Headlamp
            gethomepage.dev/group: Infrastructure
            gethomepage.dev/icon: headlamp
            traefik.ingress.kubernetes.io/router.middlewares: 'traefik-forwardauth-authelia@kubernetescrd'
            external-dns.alpha.kubernetes.io/enabled: "true"
            external-dns.alpha.kubernetes.io/hostname: headlamp.saturn.ci
            external-dns.alpha.kubernetes.io/target: direct.saturn.ci
          hosts:
            - host: headlamp.saturn.ci
              paths:
                - path: /
                  type: ImplementationSpecific
          tls:
            - secretName: headlamp.saturn.ci
              hosts:
                - headlamp.saturn.ci

  destination:
    name: in-cluster
    namespace: headlamp

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - FailOnSharedResource=true
    automated:
      prune: true
      selfHeal: true
