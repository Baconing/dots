apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-helm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    chart: kyverno
    repoURL: https://kyverno.github.io/kyverno/
    targetRevision: 3.9.2
    helm:
      releaseName: kyverno
      # TODO: Actually look through values.yaml upstream
      valuesObject:
        admissionController:
          replicas: 3
          rbac:
            clusterRole:
              extraResources:
                - apiGroups: [""]
                  resources: ["secrets"]
                  verbs: ["get", "list", "watch"]

        backgroundController:
          replicas: 3
          rbac:
            clusterRole:
              extraResources:
                - apiGroups: [""]
                  resources: ["secrets"]
                  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
                - apiGroups: ["batch"]
                  resources: ["cronjobs"]
                  verbs: ["create", "update", "patch", "delete"]
        
        cleanupController:
          replicas: 3

        reportsController:
          replicas: 3

  destination:
    name: in-cluster
    namespace: kyverno

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - FailOnSharedResource=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true

  