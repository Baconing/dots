# TODO: Resource Limits

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-helm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default

  source:
    chart: argo-cd
    repoURL: https://argoproj.github.io/argo-helm
    targetRevision: 10.1.3
    helm:
      releaseName: argocd
      valuesObject:
        global:
          domain: argocd.saturn.ci
          
          image:
            repository: quay.io/argoproj/argocd
            tag: v3.4.5

          addPrometheusAnnotations: true

        configs:
          cm:
            kustomize.buildOptions: --load-restrictor LoadRestrictionsNone

            admin.enabled: "false"

            oidc.config: |
              name: Authelia
              issuer: https://sso.saturn.ci
              clientID: argocd
              clientSecret: $oidc:oidc.client_secret
              cliClientID: argocd-cli
              requestedScopes:
                - openid
                - email
                - groups
              enableUserInfoGroups: true
              userInfoPath: /api/oidc/userinfo

          rbac:
            policy.default: role:user
            policy.csv: |
              g, administrators, role:admin
              p, role:user, *, *, *, deny

          params:
            server.insecure: true
            controller.diff.server.side: true

        redis-ha:
          enabled: true
        
        applicationSet:
          replicas: 2

          resources:
            requests:
              cpu: 10m
              memory: 64MiB
            limits:
              cpu: 50m
              memory: 256MiB

        controller:
          replicas: 1

          resources:
            requests:
              cpu: 250m
              memory: 1GiB
            limits:
              cpu: 500m
              memory: 2GiB 
        dex:
          enabled: false

        notifications:
          enabled: false
        
        repoServer:
          autoscaling:
            enabled: true
            minReplicas: 2

          resources:
            requests:
              cpu: 50m
              memory: 512MiB
            limits:
              cpu: 200m
              memory: 1GiB

          extraContainers:
            - name: sops
              image: ghcr.io/baconing/argocd-sops-cmp:2.0.0
              env:
                - name: ACS_KUSTOMIZE_OPTIONS
                  value: --load-restrictor LoadRestrictionsNone
              securityContext:
                runAsUser: 999
                runAsNonRoot: true
              volumeMounts:
                - name: var-files
                  mountPath: /var/run/argocd
                - name: plugins
                  mountPath: /home/argocd/cmp-server/plugins
                - name: cmp-tmp
                  mountPath: /tmp
                - name: sops-age-key
                  mountPath: /keys
          volumes:
            - name: cmp-tmp
              emptyDir: {}
            - name: sops-age-key
              secret:
                secretName: sops-age-key
        
        server:
          autoscaling:
            enabled: true
            minReplicas: 2

          resources:
            requests:
              cpu: 50m
              memory: 128MiB
            limits:
              cpu: 500m
              memory: 512MiB

          ingress:
            enabled: true
            ingressClassName: traefik
            tls: true
            annotations:
              traefik.ingress.kubernetes.io/router.tls: "true"
              gethomepage.dev/enabled: "true"
              gethomepage.dev/name: ArgoCD
              gethomepage.dev/group: Infrastructure
              gethomepage.dev/icon: argo-cd
              traefik.ingress.kubernetes.io/router.middlewares: 'traefik-forwardauth-authelia@kubernetescrd'
              external-dns.alpha.kubernetes.io/enabled: "true"
              external-dns.alpha.kubernetes.io/hostname: argocd.saturn.ci
              external-dns.alpha.kubernetes.io/target: direct.saturn.ci

  destination:
    name: in-cluster
    namespace: argocd

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - FailOnSharedResource=true
    automated:
      prune: true
      selfHeal: true
