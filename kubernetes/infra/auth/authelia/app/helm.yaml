apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authelia-helm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    chart: authelia
    repoURL: https://charts.authelia.com
    targetRevision: 0.10.59
    helm:
      releaseName: authelia
      valuesObject:
        image:
          registry: ghcr.io
          repository: authelia/authelia
          tag: 4.39.22
        
        redis:
          image:
            registry: ""
            repository: bitnami/redis
            tag: latest
        
        ingress:
          enabled: true
          className: "traefik"
          annotations:
            gethomepage.dev/enabled: "true"
            gethomepage.dev/name: Authelia
            gethomepage.dev/group: Security
            gethomepage.dev/icon: authelia
            traefik.ingress.kubernetes.io/router.tls: "true"
            external-dns.alpha.kubernetes.io/enabled: "true"
            external-dns.alpha.kubernetes.io/hostname: sso.saturn.ci
            external-dns.alpha.kubernetes.io/target: direct.saturn.ci
          tls:
            enabled: true
            secret: "sso.saturn.ci"
          # Ingress hostname is determined by configMap.cookies.domain and configMap.session.cookies.subdomain

        pod:
          initContainers:
            - name: init-db
              image: ghcr.io/onedr0p/postgres-init:17.4
              env:
                - name: INIT_POSTGRES_HOST
                  value: postgres-rw.database.svc.cluster.local
                - name: INIT_POSTGRES_DBNAME
                  value: authelia
                - name: INIT_POSTGRES_SUPER_PASS
                  valueFrom:
                    secretKeyRef:
                      name: postgres-superuser
                      key: password
                - name: INIT_POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: authelia
                      key: storage.postgres.username
                - name: INIT_POSTGRES_PASS
                  valueFrom:
                    secretKeyRef:
                      name: authelia
                      key: storage.postgres.password
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi

        secret:
          disabled: false
          mountPath: "/secrets"
          existingSecret: authelia
          additionalSecrets:
            authelia:
              path: jwks
              items:
                - key: oidc.jwk.RS256.pem
                  path: oidc.jwk.RS256.pem
            oidc-argocd:
                path: oidc/argocd
                items:
                  - key: oidc.client_secret_digest
                    path: client_secret_digest
            oidc-database-pgadmin:
                path: oidc/pgadmin
                items:
                  - key: oidc.client_secret_digest
                    path: client_secret_digest
            oidc-monitoring-grafana:
                path: oidc/grafana
                items:
                  - key: oidc.client_secret_digest
                    path: client_secret_digest

        configMap:
          disabled: false

          telemetry:
            metrics:
              enabled: true
              port: 9959
              serviceMonitor:
                enabled: true
          
          default_2fa_method: "totp"

          theme: dark

          totp:
            disable: false
            issuer: saturn.ci

          webauthn:
            disable: false
            display_name: saturn.ci
            attestation_conveyance_preference: indirect

          duo_api:
            enabled: false

          definitions:
            network:
              private:
                - 10.0.0.0/8

          identity_validation:
            reset_password:
              secret:
                disabled: true # todo

          authentication_backend:
            password_reset:
              disable: true # todo
            password_change:
              disable: true # todo
            
            ldap:
              enabled: true
              address: ldap://lldap-ldap:3890
              implementation: lldap
              base_dn: DC=saturn,DC=ci
              user: CN=authelia,OU=people,DC=saturn,DC=ci
              password:
                path: authentication.ldap.password
          
          password_policy:
            zxcvbn:
              enabled: true
              min_score: 2

          access_control:
            default_policy: deny
            rules:
              # Bypass Always: Secured & Authentication Related
              - domain: 
                  - "sso.saturn.ci"
                  - "ldap.saturn.ci"
                  - "vault.saturn.ci"
                policy: bypass

              # Bypass Always: Webfinger
              - domain_regex:
                  - 'saturn.ci$'
                policy: bypass
                resources:
                  - "^/.well-known(/.*)?$"

              # Bypass Always: Zipline Uploads
              - domain: "file.baconi.ng"
                policy: bypass
                resources:
                  - "^/u(/.*)?$"
                  - "^/raw(/.*)?$"
                  - "^/view(/.*)?$"

              # Two Factor: Vaultwarden Admin Dashboard
              - domain: "vault.saturn.ci"
                resources:
                  - "^/admin(/.*)?$"
                policy: one_factor # todo: two_factor after i setup email notifiactions to allow two factor sources
                subject:
                  - "group:administrators"

              # Two Factor: Secured Resources
              - domain:
                  # infra
                  - "openbao.saturn.ci" # I haven't set it up and I'll need to expose its API routes (maybe not).
                  - "traefik.saturn.ci"
                  - "longhorn.saturn.ci"
                  - "pgadmin.saturn.ci"
                  - "argocd.saturn.ci"
                  - "headlamp.saturn.ci"

                  # external services
                  - "router.saturn.ci"
                  - "nas.saturn.ci"
                  - "hass.saturn.ci"

                  # games
                  - "asf.saturn.ci"

                  # home
                  - "printer.saturn.ci"
                  - "spoolman.saturn.ci"
                  - "orcaslicer.saturn.ci"

                  # media
                  - "autobrr.saturn.ci"
                  - "bazarr.saturn.ci"
                  - "cleanuparr.saturn.ci"
                  - "lidarr.saturn.ci"
                  - "prowlarr.saturn.ci"
                  - "radarr.saturn.ci"
                  - "sonarr.saturn.ci"
                  - "torrent.saturn.ci"
                  - "slskd.saturn.ci"

                  # monitoring
                  - "prometheus.saturn.ci"
                  - "grafana.saturn.ci"
                  - "alerts.saturn.ci"

                  # other
                  - "paperless.saturn.ci" # I haven't set it up fully and it can contain sensitive information.
                  - "syncthing.saturn.ci"
                policy: one_factor # todo: two_factor after i setup email notifiactions to allow two factor sources after 
                subject:
                  - "group:administrators"

              # Two Factor: Zipline Admin Dashboard
              - domain: "file.baconi.ng"
                resources:
                  - "^/dashboard/admin(/.*)?$"
                policy: one_factor # todo: two_factor after i setup email notifiactions to allow two factor sources
                subject:
                  - "group:administrators"

              # Two Factor: Open-WebUI Admin Dashboard
              - domain: "open-webui.saturn.ci"
                resources:
                  -  "^/admin(/.*)?$"
                policy: one_factor # todo: two_factor after i setup email notifiactions to allow two factor sources
                subject:
                  - "group:administrators"

              # Two Factor: Seerr Admin Dashboard
              - domain: "seerr.saturn.ci"
                resources:
                  - "^/requests(/.*)?$"
                  - "^/blocklist(/.*)?$"
                  - "^/issues(/.*)?$"
                  - "^/users(/.*)?$"
                  - "^/settings(/.*)?$"
                policy: one_factor # todo: two_factor after i setup email notifiactions to allow two factor sources
                subject:
                  - "group:administrators"
                
              # Two Factor: Jellyfin Admin Dashboard
              - domain: "jellyfin.saturn.ci"
                resources:
                  - "^/web/#/dashboard(/.*)?$"
                  - "^/web/#/configurationpage(/.*)?$"
                  - "^/web/#/metadata(/.*)?$"
                policy: one_factor # todo: two_factor after i setup email notifiactions to allow two factor sources
                subject:
                  - "group:administrators"

              # One Factor: Semi-Public Resources
              - domain:
                  # ai
                  - "open-webui.saturn.ci"

                  - "saturn.ci" # Hajimari
                policy: one_factor

              # One Factor: Zipline User Dashboard
              - domain: "file.baconi.ng"
                policy: one_factor
                resources:
                  - "^/dashboard(/.*)?$"

              # Bypass: Fully Public Resources
              - domain:
                  # media
                  - "seerr.saturn.ci"
                  - "jellyfin.saturn.ci"
                  - "navidrome.saturn.ci"

                  # other
                  - "file.baconi.ng"
                policy: bypass
          
          session:
            encryption_key:
              path: "session.encryption_key"

            same_site: lax

            redis:
              deploy: true
              enabled: true
              host: "authelia-redis-master"
              password:
                disabled: true

            cookies:
              - domain: saturn.ci
                subdomain: sso
          
          regulation:
            max_retries: 5
            find_time: 2m
            ban_time: 10m

          storage:   
            encryption_key:
              path: "storage.encryption_key"

            postgres:
              enabled: true
              address: tcp://postgres-rw.database.svc.cluster.local:5432
              database: authelia
              schema: public
              username: authelia
              password:
                path: "storage.postgres.password"

          notifier:
            disable_startup_check: true # todo: after smtp is enabled

            smtp:
              enabled: false # todo
              password:
                disabled: true
            filesystem:
              enabled: true

          identity_providers:
            oidc:
              enabled: true

              enable_client_debug_messages: false

              hmac_secret:
                path: "identity_providers.oidc.hmac_secret"

              jwks:
                - key_id: RS256
                  algorithm: RS256
                  use: sig
                  key:
                    path: /secrets/jwks/oidc.jwk.RS256.pem
              
              claims_policies:
                grafana:
                  id_token: ["email", "name", "groups", "preferred_username"]

              authorization_policies:
                admin_2fa:
                  default_policy: 'deny'
                  rules:
                    - policy: 'two_factor'
                      subject: 'group:administrators'
                admin:
                  default_policy: 'deny'
                  rules:
                    - policy: 'one_factor'
                      subject: 'group:administrators'

              clients:
                - client_name: ArgoCD
                  client_id: argocd
                  client_secret:
                    path: /secrets/oidc/argocd/client_secret_digest
                  authorization_policy: admin # todo: two_factor after i setup email notifiactions to allow two factor sources
                  redirect_uris:
                    - "https://argocd.saturn.ci/auth/callback"
                  scopes:
                    - "openid"
                    - "groups"
                    - "email"
                  response_types:
                    - "code"
                  grant_types:
                    - "authorization_code"
                  access_token_signed_response_alg: 'none'
                  userinfo_signed_response_alg: 'none'
                  token_endpoint_auth_method: "client_secret_post"

                - client_name: ArgoCD (CLI)
                  client_id: argocd-cli
                  authorization_policy: admin # todo: two_factor after i setup email notifiactions to allow two factor sources
                  redirect_uris:
                    - "http://localhost:8085/auth/callback"
                  scopes:
                    - "openid"
                    - "offline_access"
                    - "groups"
                    - "email"
                  public: true
                  require_pkce: true
                  pkce_challenge_method: "S256"
                  grant_types:
                    - "authorization_code"
                    - "refresh_token"
                  access_token_signed_response_alg: 'none'
                  userinfo_signed_response_alg: 'none'
                  token_endpoint_auth_method: "none"

                - client_id: pgadmin
                  client_name: pgAdmin
                  client_secret:
                    path: /secrets/oidc/pgadmin/client_secret_digest
                  authorization_policy: admin # todo: two_factor after i setup email notifiactions to allow two factor sources
                  redirect_uris:
                    - "https://pgadmin.saturn.ci/oauth2/authorize"
                  scopes:
                    - "openid"
                    - "profile"
                    - "email"
                  response_types:
                    - "code"
                  grant_types:
                    - "authorization_code"
                  token_endpoint_auth_method: "client_secret_basic"
                  require_pkce: false

                - client_id: 'grafana'
                  client_name: 'Grafana'
                  client_secret:
                    path: /secrets/oidc/grafana/client_secret_digest
                  authorization_policy: admin # todo: two_factor after i setup email notifiactions to allow two factor sources
                  claims_policy: grafana
                  redirect_uris:
                    - https://grafana.saturn.ci/login/generic_oauth
                  scopes:
                    - openid
                    - profile
                    - groups
                    - email
                  public: false
                  response_types:
                    - 'code'
                  grant_types:
                    - 'authorization_code'
                  access_token_signed_response_alg: none
                  userinfo_signed_response_alg: none
                  token_endpoint_auth_method: client_secret_basic
                  require_pkce: true
                  pkce_challenge_method: S256

  destination:
    name: in-cluster
    namespace: auth

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - FailOnSharedResource=true
    automated:
      prune: true
      selfHeal: true

  
