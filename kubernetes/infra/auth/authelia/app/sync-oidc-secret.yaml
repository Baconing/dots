apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: sync-oidc-secret-to-auth
  annotations:
    policies.kyverno.io/title: Sync OIDC Secret to Auth Namespace
    policies.kyverno.io/description: >-
      Watches for Secrets named "oidc" or "odic-(postfix)" in any namespace.
      When found, generates a copy in the "auth" namespace named
      "odic-{source-namespace}" for "oidc", or
      "odic-{source-namespace}-{postfix}" for "odic-(postfix)".
spec:
  rules:
    - name: sync-oidc-secret
      match:
        any:
          - resources:
              kinds:
                - Secret
              names:
                - oidc
                - odic-*
      exclude:
        any:
          - resources:
              namespaces:
                - auth
      context:
        - name: normalized_name
          variable:
            value: >-
              {{
                regex_replace_all(
                  '^oidc$',
                  request.object.metadata.name,
                  ''
                )
              }}
        - name: postfix_suffix
          variable:
            value: >-
              {{
                regex_replace_all(
                  '^odic-',
                  normalized_name,
                  '-'
                )
              }}
      generate:
        apiVersion: v1
        kind: Secret
        name: >-
          odic-{{ request.object.metadata.namespace }}{{ postfix_suffix }}
        namespace: auth
        synchronize: true
        data:
          metadata:
            labels:
              kyverno.io/source-namespace: "{{ request.object.metadata.namespace }}"
          type: "{{ request.object.type }}"
          data: "{{ request.object.data }}"
