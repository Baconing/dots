apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-helm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    chart: grafana
    repoURL: https://grafana-community.github.io/helm-charts/
    targetRevision: 12.10.4
    helm:
      releaseName: grafana
      valuesObject:
        image:
          repository: grafana/grafana
          tag: 13.1.3

        autoscaling:
          enabled: true
          minReplicas: 1

        envValueFrom:
          GRAFANA_OAUTH_CLIENT_SECRET:
            secretKeyRef:
              name: oidc-grafana
              key: oidc.client_secret
        
        envFromSecrets:
          - name: grafana-postgres

        extraInitContainers:
            - name: init-db
              image: ghcr.io/onedr0p/postgres-init:17.4
              env:
                - name: INIT_POSTGRES_HOST
                  value: postgres-rw.database.svc.cluster.local
                - name: INIT_POSTGRES_DBNAME
                  value: grafana
                - name: INIT_POSTGRES_SUPER_PASS
                  valueFrom:
                    secretKeyRef:
                      name: postgres-superuser
                      key: password
                - name: INIT_POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: grafana-postgres
                      key: GRAFANA_DATABASE_USER
                - name: INIT_POSTGRES_PASS
                  valueFrom:
                    secretKeyRef:
                      name: grafana-postgres
                      key: GRAFANA_DATABASE_PASS
        
        podDisruptionBudget:
          enabled: true
          minAvailable: 1

        serviceMonitor:
          enabled: true

        persistence:
          inMemory:
            enabled: true
        
        initChownData:
          enabled: true

        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Prometheus
                type: prometheus
                access: proxy
                url: http://prometheus-operated.monitoring.svc.cluster.local:9090
                isDefault: true
        
        grafana.ini:
          server:
            root_url: https://grafana.saturn.ci
            serve_from_sub_path: false
          auth:
            disable_login_form: true
            managed_service_accounts_enabled: true
          auth.basic:
            enabled: false
          auth.generic_oauth:
            enabled: true
            auto_login: true
            name: Authelia
            icon: signin
            client_id: grafana
            client_secret: $__env{GRAFANA_OAUTH_CLIENT_SECRET}
            scopes: openid profile email groups
            empty_scopes: false
            auth_url: https://sso.saturn.ci/api/oidc/authorization
            token_url: https://sso.saturn.ci/api/oidc/token
            api_url: https://sso.saturn.ci/api/oidc/userinfo
            login_attribute_path: preferred_username
            groups_attribute_path: groups
            name_attribute_path: name
            use_pkce: true
            auth_style: InHeader
            role_attribute_path: 'GrafanaAdmin'
            allow_assign_grafana_admin: true
            skip_org_role_sync: true
          database:
            type: postgres
            host: postgres-rw.database.svc.cluster.local:5432
            name: grafana
            user: $__env{GRAFANA_DATABASE_USER}
            password: $__env{GRAFANA_DATABASE_PASS}
            ssl_mode: disable

        ingress:
          enabled: true
          ingressClassName: traefik
          annotations:
            gethomepage.dev/enabled: "true"
            gethomepage.dev/name: Grafana
            gethomepage.dev/group: Monitoring
            gethomepage.dev/icon: grafana
            traefik.ingress.kubernetes.io/router.tls: "true"
            traefik.ingress.kubernetes.io/router.middlewares: 'traefik-forwardauth-authelia@kubernetescrd'
            external-dns.alpha.kubernetes.io/enabled: "true"
            external-dns.alpha.kubernetes.io/hostname: grafana.saturn.ci
            external-dns.alpha.kubernetes.io/target: direct.saturn.ci
          hosts:
            - grafana.saturn.ci
          tls:
            - secretName: grafana.saturn.ci
              hosts:
                - grafana.saturn.ci

  destination:
    name: in-cluster
    namespace: monitoring

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - FailOnSharedResource=true
    automated:
      prune: true
      selfHeal: true

  