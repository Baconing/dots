apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: termix-routes
  namespace: termix
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Termix
    gethomepage.dev/group: Dev
    gethomepage.dev/icon: termix
    external-dns.kubernetes.io/enabled: "true"
    external-dns.kubernetes.io/hostname: termix.saturn.ci
    external-dns.kubernetes.io/target: direct.saturn.ci
spec:
  entryPoints:
    - websecure
  tls:
    secretName: termix.saturn.ci
  routes:
    - match: Host(`termix.saturn.ci`) && HeadersRegexp(`Authorization`, `Basic .*`)
      priority: 10
      kind: Rule
      middlewares:
        - name: authelia-basic
          namespace: traefik
      services:
        - name: termix
          port: 8080
    - match: Host(`termix.saturn.ci`)
      priority: 1
      kind: Rule
      middlewares:
        - name: authelia-web
      services:
        - name: termix
          port: 8080