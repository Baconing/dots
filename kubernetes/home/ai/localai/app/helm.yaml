apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: localai-helm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    chart: local-ai
    repoURL: https://go-skynet.github.io/helm-charts/
    targetRevision: 3.4.2
    helm:
      releaseName: localai
      valuesObject:
        deployment:
          image:
            repository: quay.io/go-skynet/local-ai
            tag: v4.12.1-gpu-intel

          env:
            MODELS_PRELOAD_KEEP_ALIVE: 300
            COMPEL_SYCL: 1

        resources:
          requests:
            cpu: 500m
            memory: 1Gi
            gpu.intel.com/i915: "1"
          limits:
            cpu: 4
            memory: 12Gi
            gpu.intel.com/i915: "1"

        nodeSelector:
          "feature.node.kubernetes.io/arc-a750": "true"

        persistence:
          models: 
            enabled: true
            labels:
              backup.kyverno.io/exclude: "true"
            storageClass: "longhorn"
            accessModes:
              - ReadWriteMany
            size: 64Gi
          output:
            enabled: false

        ingress:
          enabled: true
          className: traefik
          annotations:
            gethomepage.dev/enabled: "true"
            gethomepage.dev/name: LocalAI
            gethomepage.dev/group: AI
            gethomepage.dev/icon: localai
            gethomepage.dev/weight: "1"
            traefik.ingress.kubernetes.io/router.tls: "true"
            traefik.ingress.kubernetes.io/router.middlewares: 'traefik-forwardauth-authelia@kubernetescrd'
            external-dns.kubernetes.io/enabled: "true"
            external-dns.kubernetes.io/hostname: localai.saturn.ci
            external-dns.kubernetes.io/target: direct.saturn.ci
          hosts:
            - host: localai.saturn.ci
              paths:
                - path: /
                  pathType: ImplementationSpecific
          tls:
            - hosts:
                - localai.saturn.ci
              secretName: localai.saturn.ci

  destination:
    name: in-cluster
    namespace: ai

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - FailOnSharedResource=true
      - RespectIgnoreDifferences=true
    automated:
      prune: true
      selfHeal: true

  