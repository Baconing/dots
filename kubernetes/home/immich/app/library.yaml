# TODO: Setup specific credentials for SMB for specific things like immich and such.

apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-library
  namespace: immich
  labels:
    name: immich-library
spec:
  accessModes: 
    - ReadWriteMany
  capacity:
    storage: 21Ti
  storageClassName: smb
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: phoebe.default.svc.cluster.local/photos##
    volumeAttributes:
      source: //10.10.2.2/photos
    nodeStageSecretRef:
      name: phoebe-smb-credentials
      namespace: default
  mountOptions:
    - dir_mode=0775
    - file_mode=0664
    - uid=1000
    - gid=1000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
  namespace: immich
spec:
  accessModes: 
    - ReadWriteMany
  resources:
    requests:
      storage: 21Ti
  storageClassName: smb
  volumeName: immich-library