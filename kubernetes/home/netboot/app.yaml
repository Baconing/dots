apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: netboot
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/baconing/dots.git
    targetRevision: master
    path: kubernetes/home/netboot/app

  destination:
    name: in-cluster
    namespace: netboot

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - FailOnSharedResource=true
    automated:
      prune: true
      selfHeal: true

  