apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  name: netboot
  namespace: netboot
spec:
  clusterRef:
    name: seaweedfs
    namespace: seaweedfs
---
apiVersion: seaweed.seaweedfs.com/v1
kind: ResourceReferenceGrant
metadata:
  name: netboot
  namespace: seaweedfs
spec:
  from:
    - { group: seaweed.seaweedfs.com, kind: Bucket, namespace: netboot }
    - { group: seaweed.seaweedfs.com, kind: S3Identity, namespace: netboot }
    - { group: seaweed.seaweedfs.com, kind: S3Credentials, namespace: netboot }
    - { group: seaweed.seaweedfs.com, kind: S3Policy, namespace: netboot }
    - { group: seaweed.seaweedfs.com, kind: S3PolicyBinding, namespace: netboot }
  to:
    - group: seaweed.seaweedfs.com
      kind: Seaweed
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  name: netboot-github
  namespace: netboot
spec:
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: netboot-github
  namespace: netboot
spec:
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  identityRef:
    name: netboot-github
  secretRef:
    name: s3-github
    namespace: netboot
    accessKeyField: accessKey
    secretKeyField: secretKey
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Policy
metadata:
  name: netboot-github
  namespace: netboot
spec:
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  policyDocument: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Principal": "*",
          "Action": [
            "s3:AbortMultipartUpload",
            "s3:ListBucketMultipartUploads",
            "s3:ListMultipartUploadParts",
            "s3:PutObject"
          ],
          "Resource": [
            "arn:aws:s3:::netboot",
            "arn:aws:s3:::netboot/*"
          ]
        }
      ]
    }
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3PolicyBinding
metadata:
  name: netboot-github
  namespace: netboot
spec:
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  policyRef:
    name: netboot-github
  subjects:
    - kind: S3Identity
      name: netboot-github
