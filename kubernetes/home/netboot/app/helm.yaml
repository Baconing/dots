        #     - name: x86_64/iso/debian/installer/debian-installer-13.7.0.iso
        #       url: https://mirrors.lug.mtu.edu/debian-cd/13.7.0/amd64/iso-cd/debian-13.7.0-amd64-netinst.iso
        #     - name: x86_64/iso/debian/live/debian-live-kde-13.7.0.iso
        #       url: https://mirrors.lug.mtu.edu/debian-cd/13.7.0-live/amd64/iso-hybrid/debian-live-13.7.0-amd64-kde.iso
        #     - name: x86_64/iso/debian/live/debian-live-gnome-13.7.0.iso
        #       url: https://mirrors.lug.mtu.edu/debian-cd/13.7.0-live/amd64/iso-hybrid/debian-live-13.7.0-amd64-gnome.iso
            
        #     - name: x86_64/iso/fedora/workstation/fedora-workstation-44-1.7.iso
        #       url: https://mirrors.lug.mtu.edu/fedora/linux/releases/44/Workstation/x86_64/iso/Fedora-Workstation-Live-44-1.7.x86_64.iso
        #     - name: x86_64/iso/fedora/kde/fedora-kde-44-1.7.iso
        #       url: https://mirrors.lug.mtu.edu/fedora/linux/releases/44/KDE/x86_64/iso/Fedora-KDE-Desktop-Live-44-1.7.x86_64.iso
        #     - name: x86_64/iso/fedora/silverblue/fedora-silverblue-44-1.7.iso
        #       url: https://mirrors.lug.mtu.edu/fedora/linux/releases/44/Silverblue/x86_64/iso/Fedora-Silverblue-ostree-x86_64-44-1.7.iso
