apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: netboot-helm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    chart: netboot
    repoURL: oci://ghcr.io/baconing/charts/netboot
    targetRevision: 1.0.0-alpha-2026.10
    helm:
      releaseName: netboot
      valuesObject:
        ipxeScripts:
          http:
            enabled: true
            default.ipxe: |
              #!ipxe

              :start
              isset ${arch} || set arch x86_64
              isset ${scripts} || set scripts http://${next-server}/scripts/${arch}
              isset ${assets} || set assets http://${next-server}/assets/${arch}
              ntp 0.pool.ntp.org
              set cls:hex 1b:5b:4a
              set cls ${cls:string}

              :menu
              clear menu
              echo ${cls}

              menu Boot Menu - IP: ${ip} - MAC: ${mac:hexhyp} - next-server: ${next-server} - arch: ${arch}
              item default-host Run default script for host
              item --gap -- Operating System Installers
              item linux-installer Linux Installers
              item windows-installer Windows Installers
              item --gap -- Operating System Live Environments
              item linux-live Linux Live Environments
              item --gap -- Utilities
              item memtest86 MemTest86
              item reboot Reboot
              item shell Drop to iPXE shell
              item exit Exit iPXE and boot from local disk

              choose --timeout 5000 --default default-host target && goto switch-target
              
              :switch-target
              chain --autofree ${scripts}/${target} ||
              goto failed

              :failed
              echo Failed to chainload ${scripts}/${target}
              echo Press any key to continue...
              goto menu
            x86_64/default-host.ipxe: |
              #!ipxe

              :start
              chain --autofree ${scripts}/hosts/${mac:hexhyp} || 
              goto default

              :default
              exit
            x86_64/linux-installer.ipxe: |
              #!ipxe

              :start
              clear menu
              echo ${cls}
              menu Linux Installer Menu - IP: ${ip} - MAC: ${mac:hexhyp} - next-server: ${next-server} - arch: ${arch}
              # item alpine Alpine Linux
              item arch Arch Linux
              item artix Artix Linux
              item debian Debian
              item fedora Fedora
              item gentoo Gentoo
              item nixos NixOS
              item ubuntu Ubuntu
              item void Void Linux

              choose target && goto switch-target

              :switch-target
              chain --autofree ${scripts}/linux/installer/${target} ||
              goto failed

              :failed
              echo Failed to chainload ${scripts}/${target}
              echo Press any key to continue...

        # TODO: I don't even know if sanboot will really work with ISO images, I might just be better off booting a kernel/initrd.
