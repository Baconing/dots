        #     - name: x86_64/iso/ubuntu/ubuntu-desktop-26.04.1.iso
        #       url: https://mirrors.lug.mtu.edu/ubuntu-releases/26.04.1/ubuntu-26.04.1-desktop-amd64.iso
        #     - name: x86_64/iso/ubuntu/ubuntu-server-26.04.1.iso
        #       url: https://mirrors.lug.mtu.edu/ubuntu-releases/26.04.1/ubuntu-26.04.1-live-server-amd64.iso

        #     - name: x86_64/iso/void/void-base-latest.iso
        #       url: https://mirrors.lug.mtu.edu/voidlinux/live/current/void-live-x86_64-20250202-base.iso
        #     - name: x86_64/iso/void/void-xfce-latest.iso
        #       url: https://mirrors.lug.mtu.edu/voidlinux/live/current/void-live-x86_64-20250202-xfce.iso

        service:
          enabled: true
          type: LoadBalancer
          loadBalancerIP: 10.10.254.30

        storage:
          dataVolume:
            type: pvc
            enabled: true
            accessModes:
              - ReadWriteOnce
            size: 1Gi
            storageClass: longhorn

  destination:
    name: in-cluster
    namespace: netboot

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - FailOnSharedResource=true
    automated:
      prune: true
      selfHeal: true

  