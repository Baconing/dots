apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minecraft-lightweightskyblock-helm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    chart: minecraft
    repoURL: https://itzg.github.io/minecraft-server-charts/
    targetRevision: 5.1.3
    helm:
      releaseName: lightweight-skyblock
      valuesObject:
        image:
          repository: itzg/minecraft-server
          tag: 2026.7.0-java21-jdk
          pullPolicy: IfNotPresent

        resources:
          requests:
            cpu: 500m
            memory: 2048Mi
          limits:
            cpu: 2
            memory: 4096Mi

        extraEnv:
          INIT_MEMORY: 2048M
          MAX_MEMORY: 4096M

        livenessProbe:
          initialDelaySeconds: 300 # 5 minutes

        workloadAsStatefulSet: true
        strategyType: OnDelete

        minecraftServer:
          eula: "TRUE"
          type: AUTO_CURSEFORGE
          whitelist: "Baconing,TickleKnees"
          ops: "Baconing"
          overrideServerProperties: false

          autoCurseForge:
            apiKey:
              existingSecret: curseforge-api-token
            slug: a-lightweight-skyblock
            fileId: "9000416"
            includeMods:
              - neurina
          
        persistence:
          labels:
            recurring-job.longhorn.io/source: enabled
            recurring-job-group.longhorn.io/backup: enabled
          storageClass: longhorn
          dataDir:
            enabled: true
            Size: 4Gi
            accessModes:
              - ReadWriteOnce

        serviceAnnotations:
          mc-router.itzg.me/externalServerName: alskyblock.saturn.ci,alskyblock.local
          external-dns.alpha.kubernetes.io/enabled: "true"
          external-dns.alpha.kubernetes.io/hostname: alskyblock.saturn.ci
          external-dns.alpha.kubernetes.io/target: jupiter.saturn.ci
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"

  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/replicas

  destination:
    name: in-cluster
    namespace: minecraft

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - FailOnSharedResource=true
      - RespectIgnoreDifferences=true
    automated:
      prune: true
      selfHeal: true

  