apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minecraft-kaylaatm10lite-helm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    chart: minecraft
    repoURL: https://itzg.github.io/minecraft-server-charts/
    targetRevision: 5.1.3
    helm:
      releaseName: kaylaatm10lite
      valuesObject:
        image:
          repository: itzg/minecraft-server
          tag: 2026.9.2-java21-jdk
          pullPolicy: IfNotPresent

        resources:
          requests:
            cpu: 1
            memory: 4096Mi
          limits:
            cpu: 4
            memory: 8192Mi

        extraEnv:
          INIT_MEMORY: 4096M
          MAX_MEMORY: 7808M

        envFrom:
          - secretRef:
              name: curseforge-api-token

        livenessProbe:
          initialDelaySeconds: 300 # 5 minutes

        workloadAsStatefulSet: true
        strategyType: OnDelete

        minecraftServer:
          eula: "TRUE"
          type: AUTO_CURSEFORGE
          difficulty: easy
          whitelist: "Baconing,TickleKnees"
          ops: "Baconing"
          enableCommandBlock: true
          spawnProtection: -1
          viewDistance: 32

          motd: "i love you so os sososo so soso so sos o much meow"

          autoCurseForge:
            apiKey:
              existingSecret: curseforge-api-token
            slug: all-the-mods-10-lite
            fileId: "7420356"
            includeMods:
              - living-things

        persistence:
          labels:
            recurring-job.longhorn.io/source: enabled
            recurring-job-group.longhorn.io/backup: enabled
          storageClass: longhorn
          dataDir:
            enabled: true
            Size: 16Gi
            accessModes:
              - ReadWriteOnce

        serviceAnnotations:
          mc-router.itzg.me/externalServerName: kaylaatm10lite.minecraft.saturn.ci,kaylaatm10lite.minecraft.local
          external-dns.kubernetes.io/enabled: "true"
          external-dns.kubernetes.io/hostname: kaylaatm10lite.minecraft.saturn.ci
          external-dns.kubernetes.io/target: jupiter.saturn.ci
          external-dns.kubernetes.io/cloudflare-proxied: "false"

  destination:
    name: in-cluster
    namespace: minecraft

  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/replicas

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - FailOnSharedResource=true
      - RespectIgnoreDifferences=true
    automated:
      prune: true
      selfHeal: true

  