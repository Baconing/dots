flannel:
  podCidr: "10.42.0.0/16"

  flannel:
    image:
      repository: ghcr.io/flannel-io/flannel
      tag: v0.28.9
    flannel_cni:
      image:
        repository: ghcr.io/flannel-io/flannel-cni
        tag: v1.9.1-flannel3
    
    cniBinDir: "/var/lib/rancher/k3s/data/cni"
    cniConfDir: "/var/lib/rancher/k3s/agent/etc/cni/net.d"
    
    backend: "vxlan"
    mtu: 1340

    cniConf: |
      {
        "name":"cbr0",
        "cniVersion":"1.0.0",
        "plugins":[
          {
            "type":"flannel",
            "delegate":{
              "hairpinMode":true,
              "forceAddress":true,
              "isDefaultGateway":true
            }
          },
          {
            "type":"portmap",
            "capabilities":{
              "portMappings":true
            }
          },
          {
            "type":"bandwidth",
            "capabilities":{
              "bandwidth":true
            }
          }
        ]
      }